name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Auto-bump v2.x.x (base-10) and restore fixed debug.keystore
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases" | grep -o '"tag_name": *"v2\.[0-9]*\.[0-9]*"' | head -n 1 | grep -o '2\.[0-9]*\.[0-9]*' || true)
          if [ -z "$LATEST_TAG" ]; then
            TOTAL=1
          else
            CUR_MIN=$(echo "$LATEST_TAG" | cut -d. -f2)
            CUR_PAT=$(echo "$LATEST_TAG" | cut -d. -f3)
            TOTAL=$((CUR_MIN * 10 + CUR_PAT + 1))
          fi
          MINOR=$((TOTAL / 10))
          PATCH=$((TOTAL % 10))
          APP_VER="2.${MINOR}.${PATCH}"
          VER_CODE=$((100 + TOTAL))
          echo "APP_VER=$APP_VER" >> $GITHUB_ENV
          sed -i "s/versionCode = [0-9]*/versionCode = $VER_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$APP_VER\"/" app/build.gradle.kts
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "" | base64 -d > debug.keystore

      - name: Build Debug APK
        run: ([ -f update_bundle.zip ] && unzip -o update_bundle.zip || true) && gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}
          name: FlowSchedule v${{ env.APP_VER }}
          files: app/build/outputs/apk/debug/*.apk
